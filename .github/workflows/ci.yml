name: CI

on:
  push:
    branches: ["main", "beta"]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  pull_request:
    branches: ["main", "beta"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IS_BETA: ${{ github.ref == 'refs/heads/beta' }}
  SOLUTION: SpeedtestWatcher.slnx
  BROWSER_TEST_PROJECT: tests/SpeedtestWatcher.IntegrationTests

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      major: ${{ steps.gitversion.outputs.major }}
      minor: ${{ steps.gitversion.outputs.minor }}
      patch: ${{ steps.gitversion.outputs.patch }}
      pre-release-tag: ${{ steps.gitversion.outputs.preReleaseTag }}

    steps:
      - name: Checkout (full history required by GitVersion)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.x"

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          useConfigFile: true

      - name: Print version
        run: echo "SemVer = ${{ steps.gitversion.outputs.semVer }}"

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: version

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore -c Release

      - name: Install Chromium for the browser tests
        run: pwsh ${{ env.BROWSER_TEST_PROJECT }}/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      - name: Test
        env:
          SPEEDTEST_WATCHER_BROWSER_TESTS: required
        run: >
          dotnet test --solution ${{ env.SOLUTION }} --no-build -c Release
          --results-directory ${{ github.workspace }}/test-results --report-xunit-trx

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: xUnit Tests
          path: ./test-results/*.trx
          reporter: dotnet-trx

  docker-build:
    name: Build Docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [version, test]

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (labels only)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.semver }}
          outputs: >-
            ${{ github.event_name == 'push'
              && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME)
              || 'type=docker,name=speedtest-watcher:ci' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Check container startup
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image=speedtest-watcher:ci
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            image="$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST"
            docker pull "$image"
          fi

          container=$(docker run --detach --pull never --network none --health-interval 2s "$image")
          trap 'docker rm --force --volumes "$container" >/dev/null' EXIT

          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Status}}:{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container")
            case "$status" in
              running:healthy) exit 0 ;;
              running:starting) sleep 2 ;;
              *) break ;;
            esac
          done

          echo "::error::Container did not become healthy ($status)"
          docker logs "$container"
          exit 1

      - name: Save digest to file
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'linux-amd64' || 'linux-arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Push Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [version, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-linux-amd64
          path: /tmp/digests

      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-linux-arm64
          path: /tmp/digests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.semver }}
            type=raw,value=latest,enable=${{ env.IS_BETA == 'false' }}
            type=raw,value=${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }},enable=${{ env.IS_BETA == 'false' }}
            type=raw,value=${{ needs.version.outputs.major }},enable=${{ env.IS_BETA == 'false' }}
            type=raw,value=beta,enable=${{ env.IS_BETA == 'true' }}
            type=raw,value=${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}.${{ needs.version.outputs.patch }}-beta,enable=${{ env.IS_BETA == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

  tag:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [version, docker-merge]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.version.outputs.semver }}" || true
          git push origin "v${{ needs.version.outputs.semver }}" || true

      - name: Generate release notes
        id: notes
        run: |
          if [ "$IS_BETA" = "true" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          else
            PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          fi
          VERSION="v${{ needs.version.outputs.semver }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SEMVER="${{ needs.version.outputs.semver }}"
          MAJOR_MINOR="${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}"
          BETA_LINE="${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}.${{ needs.version.outputs.patch }}-beta"

          if [ "$IS_BETA" = "true" ]; then
            INTRO="A beta build from the \`beta\` branch, for trying changes before they're released. It may change or break between builds."
            TAG_ROWS=$(printf '| `beta` | `docker pull %s:beta` |\n| `%s` | `docker pull %s:%s` |\n| `%s` | `docker pull %s:%s` |' "$IMAGE" "$BETA_LINE" "$IMAGE" "$BETA_LINE" "$SEMVER" "$IMAGE" "$SEMVER")
          else
            INTRO=""
            TAG_ROWS=$(printf '| `latest` | `docker pull %s:latest` |\n| `%s` | `docker pull %s:%s` |\n| `%s` | `docker pull %s:%s` |' "$IMAGE" "$SEMVER" "$IMAGE" "$SEMVER" "$MAJOR_MINOR" "$IMAGE" "$MAJOR_MINOR")
          fi

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          COMMITS=$(git log "$RANGE" --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges)

          BREAKING=$(git log "$RANGE" --no-merges --format='%B%x1e' | python3 -c '
          import re, sys
          for message in sys.stdin.read().split("\x1e"):
              footer = re.search(r"^BREAKING[ -]CHANGE:[ \t]*(.*)", message, re.S | re.M)
              if footer:
                  print(footer.group(1).strip())
          ')

          BREAKING_SECTION=""
          if [ -n "$BREAKING" ]; then
            BREAKING_SECTION=$(printf '## Breaking Changes\n\n%s\n\nSee the [API guide](https://github.com/%s/blob/%s/docs/api.md) for details.\n' "$BREAKING" "${{ github.repository }}" "$VERSION")
          fi

          cat <<EOF > release_notes.md
          ${INTRO}

          ## Docker Images

          | Tag | Pull command |
          |-----|-------------|
          ${TAG_ROWS}

          Supports **linux/amd64** and **linux/arm64**.

          ${BREAKING_SECTION}

          ## Changes
          ${COMMITS}
          EOF

      - name: Stamp the OpenAPI document with the release version
        run: jq --arg version "${{ needs.version.outputs.semver }}" '.info.version = $version' docs/openapi.json > openapi.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.semver }}
          name: v${{ needs.version.outputs.semver }}
          body_path: release_notes.md
          files: openapi.json
          prerelease: ${{ env.IS_BETA == 'true' }}
          make_latest: ${{ env.IS_BETA == 'false' }}
