services:
  speedtest-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: speedtest-watcher:latest
    container_name: speedtest-watcher
    restart: unless-stopped
    ports:
      - "${PORT:-2003}:${PORT:-2003}"
    volumes:
      - ./data:/app/data
      - ./bin:/app/bin
    environment:
      - PORT=${PORT:-2003}
